<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 Earthquake Activity Explorer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a1a;
            color: #e0e0ff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: linear-gradient(135deg, #0d0d2b, #1a1a3e);
            border: 1px solid #3a3a7a;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(100,100,255,0.15);
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            color: #a0a0ff;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: #6060aa;
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        .arch {
            background: #0a0a20;
            border: 1px solid #2a2a5a;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 0.8rem;
            color: #7070cc;
            margin-bottom: 20px;
        }

        .arch span { color: #a0a0ff; font-weight: bold; }

        /* CONTRÔLES */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            color: #6060aa;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .control-group select,
        .control-group input {
            width: 100%;
            background: #0a0a20;
            border: 1px solid #3a3a7a;
            border-radius: 6px;
            color: #e0e0ff;
            padding: 8px 10px;
            font-size: 0.9rem;
        }

        /* BOUTONS */
        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3a3aaa, #5a5aff);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #5a5aff, #8080ff);
            box-shadow: 0 0 20px rgba(100,100,255,0.4);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #1a3a2a, #2a6a4a);
            color: #80ffbb;
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #2a6a4a, #3a8a6a);
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #2a2a4a;
            color: #4a4a6a;
            cursor: not-allowed;
            transform: none;
        }

        /* STATUS */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background: #0a0a20;
            border: 1px solid #2a2a5a;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }

        .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #3a3a6a;
            transition: background 0.3s;
            flex-shrink: 0;
        }

        .dot.loading { background: #ffaa00; animation: pulse 1s infinite; }
        .dot.success { background: #00ff88; }
        .dot.error { background: #ff4444; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* STATS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .stat-card {
            background: #12123a;
            border: 1px solid #3a3a7a;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .stat-card .val {
            font-size: 1.5rem;
            font-weight: bold;
            color: #a0a0ff;
        }

        .stat-card .lbl {
            font-size: 0.7rem;
            color: #6060aa;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* ALERTE */
        .alert-banner {
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-weight: bold;
            font-size: 0.95rem;
            display: none;
        }

        /* LISTE SÉISMES */
        .quake-list { display: none; }

        .quake-item {
            background: #12123a;
            border: 1px solid #2a2a5a;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }

        .quake-item:hover { border-color: #5a5aff; }

        .quake-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .quake-place {
            color: #e0e0ff;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .mag-badge {
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .mag-low { background: #1a3a1a; color: #80ff88; }
        .mag-med { background: #3a3a1a; color: #ffff80; }
        .mag-high { background: #3a1a1a; color: #ff8080; }
        .mag-major { background: #5a1a1a; color: #ff4444; }

        .quake-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            font-size: 0.8rem;
            color: #6060aa;
        }

        .quake-details span { color: #a0a0cc; }

        .tsunami-warn {
            margin-top: 8px;
            color: #ff8080;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .error-box {
            background: #1a0a0a;
            border: 1px solid #5a2a2a;
            border-radius: 8px;
            padding: 15px;
            color: #ff8080;
            display: none;
        }
    </style>
</head>
<body>
<div class="container">

    <h1>🌍 EARTHQUAKE EXPLORER</h1>
    <p class="subtitle">Powered by Athena AI Agent + USGS Real Data</p>

    <div class="arch">
        <span>Widget</span> → <span>Agent :8001</span> → <span>MCP :8000</span> → <span>USGS API</span>
    </div>

    <!-- CONTRÔLES INTERACTION 1 : Filtres -->
    <div class="controls">
        <div class="control-group">
            <label>⚡ Magnitude Min</label>
            <select id="magSelect">
                <option value="2.5">2.5+</option>
                <option value="4.0" selected>4.0+</option>
                <option value="4.5">4.5+</option>
                <option value="5.5">5.5+</option>
                <option value="7.0">7.0+ (Major)</option>
            </select>
        </div>
        <div class="control-group">
            <label>📅 Période</label>
            <select id="periodSelect">
                <option value="day">Dernières 24h</option>
                <option value="week" selected>7 derniers jours</option>
                <option value="month">30 derniers jours</option>
            </select>
        </div>
        <div class="control-group">
            <label>🔢 Résultats max</label>
            <select id="limitSelect">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="20">20</option>
            </select>
        </div>
    </div>

    <!-- BOUTONS INTERACTION 2 : Actions -->
    <div class="btn-row">
        <button class="btn btn-primary" id="btnSearch" onclick="searchEarthquakes()">
            🔍 Search Earthquakes
        </button>
        <button class="btn btn-secondary" id="btnMajor" onclick="searchMajor()">
            🚨 Major Quakes Only (7.0+)
        </button>
    </div>

    <!-- STATUS -->
    <div class="status-bar">
        <div class="dot" id="dot"></div>
        <span id="statusText">Ready — Select filters and click Search</span>
    </div>

    <!-- STATS -->
    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
            <div class="val" id="statTotal">0</div>
            <div class="lbl">Earthquakes</div>
        </div>
        <div class="stat-card">
            <div class="val" id="statMax">0</div>
            <div class="lbl">Max Magnitude</div>
        </div>
        <div class="stat-card">
            <div class="val" id="statAvg">0</div>
            <div class="lbl">Avg Magnitude</div>
        </div>
        <div class="stat-card">
            <div class="val" id="statTsunami">0</div>
            <div class="lbl">Tsunami Alerts</div>
        </div>
    </div>

    <!-- ALERTE -->
    <div class="alert-banner" id="alertBanner"></div>

    <!-- LISTE -->
    <div class="quake-list" id="quakeList"></div>

    <!-- ERREUR -->
    <div class="error-box" id="errorBox"></div>

</div>

<script>
    function setLoading(on) {
        const btn1 = document.getElementById('btnSearch');
        const btn2 = document.getElementById('btnMajor');
        const dot = document.getElementById('dot');
        btn1.disabled = on;
        btn2.disabled = on;
        dot.className = on ? 'dot loading' : 'dot';
    }

    function getMagClass(mag) {
        if (mag >= 7.0) return 'mag-major';
        if (mag >= 5.5) return 'mag-high';
        if (mag >= 4.5) return 'mag-med';
        return 'mag-low';
    }

    function formatTime(ts) {
        if (!ts) return 'Unknown';
        const d = new Date(ts);
        return d.toUTCString().replace(' GMT', ' UTC');
    }

    async function fetchData(mag, period, limit) {
        setLoading(true);
        document.getElementById('statusText').textContent = `Connecting to Athena Agent...`;
        document.getElementById('dot').className = 'dot loading';
        document.getElementById('errorBox').style.display = 'none';
        document.getElementById('quakeList').style.display = 'none';
        document.getElementById('statsGrid').style.display = 'none';
        document.getElementById('alertBanner').style.display = 'none';

        try {
            const url = `http://localhost:8001/ask?minmagnitude=${mag}&period=${period}&limit=${limit}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();

            document.getElementById('dot').className = 'dot success';
            document.getElementById('statusText').textContent =
                `✅ ${data.statistiques?.total_seismes || 0} earthquakes found — Source: ${data.source_mcp?.source || 'USGS'}`;

            // Stats
            const stats = data.statistiques || {};
            document.getElementById('statTotal').textContent = stats.total_seismes || 0;
            document.getElementById('statMax').textContent = stats.magnitude_max || 0;
            document.getElementById('statAvg').textContent = stats.magnitude_moyenne || 0;
            document.getElementById('statTsunami').textContent = stats.alertes_tsunami || 0;
            document.getElementById('statsGrid').style.display = 'grid';

            // Alerte
            const banner = document.getElementById('alertBanner');
            banner.textContent = data.alerte_globale || '';
            banner.style.display = 'block';
            if ((data.alerte_globale || '').includes('🔴')) {
                banner.style.background = '#3a0a0a';
                banner.style.color = '#ff6060';
                banner.style.border = '1px solid #7a2a2a';
            } else if ((data.alerte_globale || '').includes('🟠')) {
                banner.style.background = '#2a1a0a';
                banner.style.color = '#ffaa60';
                banner.style.border = '1px solid #5a3a0a';
            } else {
                banner.style.background = '#0a2a1a';
                banner.style.color = '#60ff88';
                banner.style.border = '1px solid #1a5a2a';
            }

            // Liste
            const list = document.getElementById('quakeList');
            const quakes = data.earthquakes || [];
            list.innerHTML = quakes.map(q => `
                <div class="quake-item">
                    <div class="quake-header">
                        <div class="quake-place">📍 ${q.lieu || 'Unknown location'}</div>
                        <div class="mag-badge ${getMagClass(q.magnitude)}">M ${q.magnitude}</div>
                    </div>
                    <div class="quake-details">
                        <div>🕳️ Depth: <span>${q.profondeur_km} km</span></div>
                        <div>🕐 Time: <span>${formatTime(q.heure_utc)}</span></div>
                        <div>🚨 Alert: <span>${q.alerte || 'none'}</span></div>
                    </div>
                    ${q.tsunami === '⚠️ Oui' ? '<div class="tsunami-warn">⚠️ TSUNAMI WARNING ISSUED</div>' : ''}
                </div>
            `).join('');
            list.style.display = 'block';

        } catch (e) {
            document.getElementById('dot').className = 'dot error';
            document.getElementById('statusText').textContent = '❌ Connection error';
            const eb = document.getElementById('errorBox');
            eb.innerHTML = `<strong>❌ Error:</strong> ${e.message}<br><br>
                ✅ Check: <a href="http://localhost:8000" style="color:#ff8080">MCP :8000</a> and 
                <a href="http://localhost:8001" style="color:#ff8080">Agent :8001</a> are running.`;
            eb.style.display = 'block';
        }

        setLoading(false);
    }

    function searchEarthquakes() {
        const mag = document.getElementById('magSelect').value;
        const period = document.getElementById('periodSelect').value;
        const limit = document.getElementById('limitSelect').value;
        fetchData(mag, period, limit);
    }

    function searchMajor() {
        document.getElementById('magSelect').value = '7.0';
        document.getElementById('periodSelect').value = 'month';
        document.getElementById('limitSelect').value = '10';
        fetchData(7.0, 'month', 10);
    }
</script>
</body>
</html>
