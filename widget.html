<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Agent Athena — Widget MCP</title>
    <style>
        /* ============================================
           STYLE GÉNÉRAL — Thème sombre Athena
        ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a1a;
            color: #e0e0ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ============================================
           CONTENEUR PRINCIPAL
        ============================================ */
        .container {
            background: linear-gradient(135deg, #0d0d2b, #1a1a3e);
            border: 1px solid #3a3a7a;
            border-radius: 16px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 0 40px rgba(100, 100, 255, 0.15);
        }

        /* ============================================
           EN-TÊTE
        ============================================ */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2rem;
            color: #a0a0ff;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .header p {
            color: #6060aa;
            font-size: 0.9rem;
        }

        /* ============================================
           ARCHITECTURE — Schéma visuel
        ============================================ */
        .architecture {
            background: #0a0a20;
            border: 1px solid #2a2a5a;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 0.85rem;
            color: #7070cc;
            letter-spacing: 1px;
        }

        .architecture span {
            color: #a0a0ff;
            font-weight: bold;
        }

        /* ============================================
           BOUTON PRINCIPAL
        ============================================ */
        .btn-ask {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #3a3aaa, #5a5aff);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }

        .btn-ask:hover {
            background: linear-gradient(135deg, #5a5aff, #8080ff);
            box-shadow: 0 0 20px rgba(100, 100, 255, 0.4);
            transform: translateY(-2px);
        }

        .btn-ask:active {
            transform: translateY(0px);
        }

        .btn-ask:disabled {
            background: #2a2a4a;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ============================================
           ZONE DE STATUT
        ============================================ */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 10px 15px;
            background: #0a0a20;
            border-radius: 8px;
            border: 1px solid #2a2a5a;
            font-size: 0.85rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3a3a6a;
            transition: background 0.3s;
        }

        .status-dot.loading {
            background: #ffaa00;
            animation: pulse 1s infinite;
        }

        .status-dot.success {
            background: #00ff88;
        }

        .status-dot.error {
            background: #ff4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ============================================
           ZONE DE RÉSULTATS
        ============================================ */
        .result-box {
            background: #0a0a20;
            border: 1px solid #2a2a5a;
            border-radius: 10px;
            padding: 20px;
            min-height: 120px;
            display: none;
        }

        .result-box.visible {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================
           CARTES DE RÉSULTATS
        ============================================ */
        .result-card {
            background: #12123a;
            border: 1px solid #3a3a7a;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .result-card:last-child {
            margin-bottom: 0;
        }

        .result-card .label {
            color: #6060aa;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .result-card .value {
            color: #e0e0ff;
            font-size: 1rem;
            font-weight: bold;
        }

        .result-card .conseil {
            color: #a0ffc0;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* ============================================
           FOOTER
        ============================================ */
        .footer {
            text-align: center;
            margin-top: 25px;
            color: #3a3a6a;
            font-size: 0.75rem;
        }

        .footer a {
            color: #5a5aaa;
            text-decoration: none;
        }

        .footer a:hover {
            color: #a0a0ff;
        }

        /* ============================================
           ERREUR
        ============================================ */
        .error-box {
            background: #1a0a0a;
            border: 1px solid #5a2a2a;
            border-radius: 8px;
            padding: 15px;
            color: #ff8080;
            font-size: 0.9rem;
        }

    </style>
</head>
<body>

    <div class="container">

        <!-- EN-TÊTE -->
        <div class="header">
            <h1>🤖 AGENT ATHENA</h1>
            <p>Widget interactif connecté au serveur MCP</p>
        </div>

        <!-- SCHÉMA ARCHITECTURE -->
        <div class="architecture">
            <span>Widget</span> → <span>Agent IA :8001</span> → <span>MCP :8000</span> → <span>API Externe</span>
        </div>

        <!-- BOUTON PRINCIPAL -->
        <button class="btn-ask" id="btnAsk" onclick="interrogerAgent()">
            ⚡ Interroger l'Agent Athena
        </button>

        <!-- BARRE DE STATUT -->
        <div class="status-bar">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">En attente — Clique sur le bouton pour démarrer</span>
        </div>

        <!-- ZONE DE RÉSULTATS -->
        <div class="result-box" id="resultBox"></div>

        <!-- FOOTER -->
        <div class="footer">
            <p>
                🔗 
                <a href="http://localhost:8001/docs" target="_blank">Agent :8001</a> · 
                <a href="http://localhost:8000/docs" target="_blank">MCP :8000</a> · 
                <a href="https://github.com/DenisCloudComputing/agent-mcp-bridge" target="_blank">GitHub</a>
            </p>
        </div>

    </div>

    <script>
        // ============================================================
        // FONCTION PRINCIPALE — Interroge l'agent IA
        // ============================================================
        async function interrogerAgent() {

            // --- Récupère les éléments HTML ---
            const btn = document.getElementById('btnAsk');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const resultBox = document.getElementById('resultBox');

            // --- État : chargement ---
            btn.disabled = true;
            btn.textContent = '⏳ Interrogation en cours...';
            statusDot.className = 'status-dot loading';
            statusText.textContent = 'Connexion à l\'agent Athena sur le port 8001...';
            resultBox.className = 'result-box';
            resultBox.innerHTML = '';

            try {
                // --- Appel à l'agent IA (port 8001) ---
                const response = await fetch('http://localhost:8001/ask');

                if (!response.ok) {
                    throw new Error(`Erreur HTTP : ${response.status}`);
                }

                const data = await response.json();

                // --- État : succès ---
                statusDot.className = 'status-dot success';
                statusText.textContent = '✅ Réponse reçue de l\'agent Athena !';

                // --- Affiche les résultats ---
                const analyse = data.analyse || {};
                const sourceMcp = data.source_mcp || {};

                resultBox.className = 'result-box visible';
                resultBox.innerHTML = `
                    <div class="result-card">
                        <div class="label">💡 Conseil de l'Agent Athena</div>
                        <div class="conseil">${analyse.conseil || 'Aucun conseil disponible'}</div>
                    </div>

                    <div class="result-card">
                        <div class="label">🎯 Activité suggérée</div>
                        <div class="value">${analyse.activite_suggeree || 'Non disponible'}</div>
                    </div>

                    <div class="result-card">
                        <div class="label">📂 Catégorie</div>
                        <div class="value">${analyse.categorie || 'Non disponible'}</div>
                    </div>

                    <div class="result-card">
                        <div class="label">👥 Format</div>
                        <div class="value">${analyse.format || 'Non disponible'}</div>
                    </div>

                    <div class="result-card">
                        <div class="label">♿ Accessibilité</div>
                        <div class="value">${analyse.accessibilite || 'Non disponible'}</div>
                    </div>

                    <div class="result-card">
                        <div class="label">🔗 Source MCP</div>
                        <div class="value">${sourceMcp.source_api || 'Non disponible'} — ${sourceMcp.status || ''}</div>
                    </div>

                    <div class="result-card">
                        <div class="label">🏗️ Architecture</div>
                        <div class="value" style="font-size:0.85rem; color:#6060aa;">${data.architecture || ''}</div>
                    </div>
                `;

            } catch (error) {
                // --- État : erreur ---
                statusDot.className = 'status-dot error';
                statusText.textContent = '❌ Erreur de connexion';

                resultBox.className = 'result-box visible';
                resultBox.innerHTML = `
                    <div class="error-box">
                        <strong>❌ Erreur :</strong> ${error.message}<br><br>
                        <strong>💡 Vérifie que :</strong><br>
                        • Le serveur MCP tourne sur <a href="http://localhost:8000" style="color:#ff8080">http://localhost:8000</a><br>
                        • L'agent IA tourne sur <a href="http://localhost:8001" style="color:#ff8080">http://localhost:8001</a>
                    </div>
                `;
            }

            // --- Réactive le bouton ---
            btn.disabled = false;
            btn.textContent = '⚡ Interroger l\'Agent Athena';
        }
    </script>

</body>
</html>
